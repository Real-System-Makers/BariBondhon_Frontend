<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TenantManagement</title>
    <link rel="stylesheet" href="../styles/tenant_management.css">
</head>
<body>
    <div class="phone-container">
        <div class="header">
            <div class="header-content">
                <a href="#" class="back-btn">←</a>
                <div class="header-title">Tenant Management</div>
            </div>
        </div>

        <div class="content">
            <div class="tenant-list-container" id="tenantList">

                <div class="flat-tenant-card" data-flat-id="A-1">
                    <div class="flat-name">Flat A-1</div>
                    <div class="occupied-info">
                        <div class="tenant-details">
                            <div class="tenant-avatar">AM</div>
                            <div>
                                <div class="tenant-name">Abdullah Al Masud</div>
                                <div class="tenant-contact">📞 01712-345678</div>
                            </div>
                        </div>
                        <div class="rent-status">
                            <span class="status-label">October Rent</span>
                            <span class="status-badge status-paid">Paid</span>
                        </div>
                    </div>
                </div>

                <div class="flat-tenant-card" data-flat-id="A-2">
                    <div class="flat-name">Flat A-2</div>
                    <div class="vacant-info">
                        <div class="vacant-text">This flat is vacant.</div>
                        <button class="assign-btn" data-flat-name="Flat A-2">Assign a Tenant</button>
                    </div>
                </div>
                
                <div class="flat-tenant-card" data-flat-id="B-1">
                    <div class="flat-name">Flat B-1</div>
                    <div class="occupied-info">
                        <div class="tenant-details">
                            <div class="tenant-avatar">FK</div>
                            <div>
                                <div class="tenant-name">Fatima Khan</div>
                                <div class="tenant-contact">📞 01998-765432</div>
                            </div>
                        </div>
                        <div class="rent-status">
                            <span class="status-label">October Rent</span>
                            <span class="status-badge status-due">Due</span>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <div class="modal-overlay" id="assignTenantModal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">Assign Tenant to <span id="modalFlatName"></span></div>
                <button class="close-btn" id="closeModalBtn">×</button>
            </div>
            <form id="assignTenantForm">
                <div class="modal-body">
                    <div class="form-group">
                        <label for="tenantName" class="form-label">Tenant's Full Name</label>
                        <input type="text" id="tenantName" class="form-input" placeholder="e.g., Rahim Ahmed" required>
                    </div>
                    <div class="form-group">
                        <label for="contactNumber" class="form-label">Contact Number</label>
                        <input type="tel" id="contactNumber" class="form-input" placeholder="e.g., 01xxxxxxxxx" required>
                    </div>
                    <div class="form-group">
                        <label for="advancePaid" class="form-label">Advance Paid (৳)</label>
                        <input type="number" id="advancePaid" class="form-input" placeholder="e.g., 20000" required>
                    </div>
                     <div class="form-group">
                        <label for="rentStartDate" class="form-label">Rent Start Date</label>
                        <input type="date" id="rentStartDate" class="form-input" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="submit" class="save-btn">Confirm Assignment</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../script/tenant_management.js"></script>
</body>
</html>
