<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electricity Reading Entry</title>
    <link rel="stylesheet" href="../styles/electrcity_entry.css">
</head>
<body>
    <div class="phone-container">
        <div class="header">
            <div class="header-content">
                <a href="#" class="back-btn">←</a>
                <div class="header-title">Electricity Bill</div>
            </div>
        </div>

        <div class="content">
            <form id="meterReadingForm" class="form-container">
                <div class="page-info">
                    <p class="info-text">Enter the current meter reading for each flat to calculate this month's bill.</p>
                </div>

                <div class="reading-header">
                    <span class="header-label flat">Flat</span>
                    <span class="header-label prev">Previous Reading</span>
                    <span class="header-label curr">Current Reading</span>
                </div>

                <div class="reading-list-container">
                    <div class="reading-row" style="animation-delay: 0.1s;">
                        <div class="flat-label">A-1</div>
                        <input type="number" class="reading-input readonly-input" value="5420" readonly>
                        <input type="number" class="reading-input current-reading" placeholder="Enter" required>
                    </div>
                    <div class="reading-row" style="animation-delay: 0.2s;">
                        <div class="flat-label">A-2</div>
                        <input type="number" class="reading-input readonly-input" value="3155" readonly>
                        <input type="number" class="reading-input current-reading" placeholder="Enter" required>
                    </div>
                    <div class="reading-row" style="animation-delay: 0.3s;">
                        <div class="flat-label">B-1</div>
                        <input type="number" class="reading-input readonly-input" value="7890" readonly>
                        <input type="number" class="reading-input current-reading" placeholder="Enter" required>
                    </div>
                    <div class="reading-row" style="animation-delay: 0.4s;">
                        <div class="flat-label">B-2</div>
                        <input type="number" class="reading-input readonly-input" value="4512" readonly>
                        <input type="number" class="reading-input current-reading" placeholder="Enter" required>
                    </div>
                </div>
            </form>
            
            <div class="footer-action">
                <button type="submit" form="meterReadingForm" class="submit-btn">Submit Readings</button>
            </div>
        </div>
    </div>

    <script src="../script/electrcity_entry.js"></script>
</body>
</html>
