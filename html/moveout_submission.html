<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Move-Out Submission</title>
    <link rel="stylesheet" href="../styles/moveout_submission.css">
</head>
<body>
    <div class="phone-container">
        <div class="header">
            <a href="#" class="back-btn">←</a>
            <div class="header-title">Submit Move-Out Notice</div>
        </div>

        <div class="content">
            <form id="moveOutForm">
                <div class="notice-period-info">
                    ℹ️ As per your rental agreement, a <strong>2-month notice period</strong> is required.
                </div>
                <div class="form-group">
                    <label for="moveOutDate" class="form-label">Select Move-Out Month & Year</label>
                    <input type="month" id="moveOutDate" class="form-input" required>
                </div>
                <button type="submit" class="submit-btn">Submit for Review</button>
            </form>

            <div id="pendingMessage" class="pending-message">
                <div class="pending-icon">⏳</div>
                <div class="pending-title">Request is Pending</div>
                <div class="pending-details">
                    Your move-out request for <strong id="submittedDate"></strong> is under review.
                </div>
                <div class="countdown-timer">
                    Auto-submission in <strong id="countdown">7 days</strong>.
                </div>
                <button id="cancelBtn" class="cancel-btn">Cancel Move-Out Request</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="confirmationModal">
        <div class="modal-content">
            <h3 class="modal-title" id="modalTitle">Modal Title</h3>
            <p class="modal-text" id="modalText">Modal message goes here.</p>
            <div class="modal-footer" id="modalFooter">
                </div>
        </div>
    </div>
    
    <script src="../script/moveout_submission.js"></script>
</body>
</html>
