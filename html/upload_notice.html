<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AddNotice</title>
    <link rel="stylesheet" href="../styles/upload_notice.css">
</head>
<body>
    <div class="phone-container">
        <div class="header">
            <a href="#" class="back-btn">←</a>
            <div class="header-title">Post a New Notice</div>
        </div>

        <div class="content">
            <form id="notice-form">
                <div class="form-group">
                    <label for="notice-title" class="form-label">Notice Title</label>
                    <input type="text" id="notice-title" class="form-input" placeholder="e.g., Lift Maintenance Schedule" required>
                </div>

                <div class="form-group">
                    <label for="notice-details" class="form-label">Details</label>
                    <textarea id="notice-details" class="form-textarea" placeholder="Write the full notice content here..." required></textarea>
                </div>

                <div class="form-group">
                    <label class="form-label">Notice Type</label>
                    <div class="notice-type-chips">
                        <div class="chip active" data-type="Maintenance">Maintenance</div>
                        <div class="chip" data-type="Urgent">Urgent</div>
                        <div class="chip" data-type="Information">Information</div>
                        <div class="chip" data-type="Meeting">Meeting</div>
                    </div>
                </div>

                <div class="form-group">
                    <div class="urgent-toggle">
                        <label for="is-urgent" class="form-label" style="margin-bottom: 0;">Mark as Urgent</label>
                        <label class="toggle-switch">
                            <input type="checkbox" id="is-urgent">
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Attach File (Optional)</label>
                    <label for="file-upload" class="file-upload-label">
                        <span id="file-upload-text">📎 Click to upload a file</span>
                    </label>
                    <input type="file" id="file-upload" style="display: none;">
                </div>

                <button type="submit" class="submit-btn">Post Notice</button>
            </form>
        </div>
    </div>
    
    <script src="../script/upload_notice.js"></script>
</body>
</html>
