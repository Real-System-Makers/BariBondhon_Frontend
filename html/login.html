<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BariBondhon - Login</title>
    <link rel="stylesheet" href="../styles/login.css">
</head>
<body>
    <div class="phone-container theme-owner" id="phoneContainer">
        <div class="bg-shape shape1"></div>
        <div class="bg-shape shape2"></div>
        
        <div class="login-container">
            <div class="logo-section">
                <div class="logo">BB</div>
                <h1 class="app-name">BariBondhon</h1>
                <p class="app-tagline">Housing Management Made Easy</p>
            </div>
            <div class="form-section">
                <div class="input-group">
                    <span class="input-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                        </svg>
                    </span>
                    <input type="text" class="input-field" placeholder="Username">
                </div>
                <div class="input-group">
                    <span class="input-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM9 8V6c0-1.66 1.34-3 3-3s3 1.34 3 3v2H9z"/>
                        </svg>
                    </span>
                    <input type="password" class="input-field" placeholder="Password">
                </div>
                <div class="role-toggle">
                    <label class="toggle-label">Login as</label>
                    <div class="toggle-container">
                        <div class="toggle-option active" data-role="owner">Owner</div>
                        <div class="toggle-option" data-role="tenant">Tenant</div>
                    </div>
                </div>
                <button class="login-button">Login</button>
                <div class="bottom-links">
                    <a href="#" class="forgot-password">Forgot Password?</a>
                    <p class="signup-text">
                        Don't have an account? 
                        <a href="#" class="signup-link">Register</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
    
    <script src="../script/login.js"></script>
</body>
</html>
